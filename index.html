<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter Reader App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px;
            margin: 0;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin: 0 0 20px 0;
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
        }

        .primary-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-upload {
            background: #10b981;
            margin-bottom: 12px;
        }

        .btn-process {
            background: #6366f1;
            margin-top: 12px;
        }

        input[type="file"] {
            display: none;
        }

        img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 20px 20px 32px 20px;
            border-radius: 24px 24px 0 0;
            text-align: center;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 16px;
        }

        .sheet-btn {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            background: #f1f5f9;
            color: #1e293b;
            cursor: pointer;
        }

        .sheet-btn:active {
            background: #e2e8f0;
        }

        .sheet-btn.cancel {
            background: #fef2f2;
            color: #ef4444;
            margin-top: 10px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>📸 สแกนมิเตอร์</h2>

        <button type="button" class="primary-btn btn-upload" onclick="openSheet()">
            <span>📷</span> เลือก/ถ่ายรูปมิเตอร์
        </button>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="previewImage(event)">
        <input type="file" id="galleryInput" accept="image/*" onchange="previewImage(event)">

        <img id="preview" alt="Meter Preview">

        <button class="primary-btn btn-process" onclick="processAndUpload()">
            อ่านค่าและบันทึกข้อมูล
        </button>

        <div id="status" style="margin-top: 16px; color: #64748b; font-size: 14px;"></div>
        <div id="result" style="margin-top: 16px; font-size: 18px; font-weight: 700; color: #0f172a;"></div>
    </div>

    <div id="actionSheet" class="modal-overlay" onclick="closeSheet(event)">
        <div class="modal-content">
            <div class="modal-title">เลือกช่องทางอัปโหลดรูปภาพ</div>
            <button class="sheet-btn" onclick="triggerInput('cameraInput')">📷 ถ่ายรูปด้วยกล้อง</button>
            <button class="sheet-btn" onclick="triggerInput('galleryInput')">🖼️ เลือกจากคลังรูปภาพ</button>
            <button class="sheet-btn cancel" onclick="closeSheet()">ยกเลิก</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ssotifsagmrvhqzlesii.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_h3U6f5PNBFwp-r7PnYWNtQ_IyQ635yI';
        const part1 = 'AQ.Ab8RN6JI-q10Gl_ouJnzMMXan';
        const part2 = 'TWwERdxxW8Kni4Atdtm6vpVvw';
        const GEMINI_API_KEY = part1 + part2;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedFile = null;

        function openSheet() {
            document.getElementById('actionSheet').style.display = 'flex';
        }

        function closeSheet(e) {
            if (!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('cancel')) {
                document.getElementById('actionSheet').style.display = 'none';
            }
        }

        function triggerInput(inputId) {
            closeSheet();
            document.getElementById(inputId).click();
        }

        function previewImage(event) {
            const img = document.getElementById('preview');
            if (event.target.files && event.target.files[0]) {
                selectedFile = event.target.files[0];
                img.src = URL.createObjectURL(selectedFile);
                img.style.display = 'block';
            }
        }

        async function processAndUpload() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');

            if (!selectedFile) {
                alert('กรุณาเลือกหรือถ่ายรูป');
                return;
            }

            const file = selectedFile;
            statusDiv.innerText = '⏳ กำลังให้อ่านตัวเลขมิเตอร์...';
            resultDiv.innerText = '';

            try {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];

                    const geminiResponse = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "อ่านเฉพาะตัวเลขมิเตอร์ในภาพ ตอบกลับมาเฉพาะตัวเลขล้วนๆ เท่านั้น ห้ามมีข้อความอื่น" },
                                    { inline_data: { mime_type: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const geminiData = await geminiResponse.json();

                    if (geminiData.error) throw new Error('Gemini API Error: ' + geminiData.error.message);
                    if (!geminiData.candidates || !geminiData.candidates[0]) throw new Error('ไม่สามารถอ่านตัวเลขจากภาพนี้ได้');

                    const meterNum = geminiData.candidates[0].content.parts[0].text.trim();

                    statusDiv.innerText = '⏳ กำลังอัปโหลดรูปภาพลง Storage...';

                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;

                    const { error: storageError } = await supabaseClient.storage
                        .from('meter-images')
                        .upload(fileName, file);

                    if (storageError) throw storageError;

                    const { data: urlData } = supabaseClient.storage
                        .from('meter-images')
                        .getPublicUrl(fileName);

                    const imageUrl = urlData.publicUrl;

                    statusDiv.innerText = '⏳ กำลังบันทึกข้อมูลลง Database...';

                    const { error: dbError } = await supabaseClient
                        .from('meter_reads')
                        .insert([{ meter_number: meterNum, image_url: imageUrl }]);

                    if (dbError) throw dbError;

                    statusDiv.innerText = '✅ สำเร็จแล้ว!';
                    resultDiv.innerText = `เลขมิเตอร์ที่อ่านได้: ${meterNum}`;
                };

            } catch (err) {
                console.error(err);
                statusDiv.innerText = '❌ เกิดข้อผิดพลาด: ' + err.message;
            }
        }
    </script>
</body>

</html>
